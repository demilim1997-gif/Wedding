<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benjamin & Demi</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #faf7f1;
    color: #665644;
    font-family: Georgia, serif;
    text-align: center;
}

header {
    padding: 40px 15px;
    background: linear-gradient(135deg,#eee4d5,#faf7f1);
    border-bottom: 1px solid #d9c5a6;
}

h1 {
    font-size: 34px;
    font-weight: normal;
    letter-spacing: 2px;
}

.small-title {
    font-size: 11px;
    letter-spacing: 4px;
}

.date {
    font-size: 13px;
    letter-spacing: 3px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 25px 15px;
}

h2 {
    font-size: 22px;
    font-weight: normal;
}

.description {
    color: #998875;
    font-size: 13px;
    line-height: 1.8;
}

input {
    width: 100%;
    max-width: 430px;
    padding: 16px;
    margin: 15px auto;
    border: 1px solid #d6c4a7;
    border-radius: 5px;
    font-size: 16px;
    text-align: center;
}

.search-button {
    display: block;
    width: 100%;
    max-width: 430px;
    margin: 10px auto 25px;
    padding: 16px;
    background: #b49a75;
    color: white;
    border: none;
    border-radius: 5px;
    letter-spacing: 2px;
}

#result, #mapResult {
    max-width: 430px;
    margin: 20px auto;
    padding: 20px;
    background: white;
    border: 1px solid #dfcfb7;
    border-radius: 8px;
}

#result:empty, #mapResult:empty {
    display: none;
}

.table-number {
    font-size: 32px;
    color: #b49a75;
    margin: 15px;
}

.map-heading {
    margin-top: 45px;
}

.map {
    position: relative;
    width: 100%;
    max-width: 600px;
    aspect-ratio: 710 / 875;
    margin: 25px auto;
    background: #fff;
    border: 1px solid #d8c8b2;
    overflow: hidden;
}

.stage {
    position: absolute;
    left: 33%;
    top: 5%;
    width: 34%;
    height: 11%;
    background: #eee4d5;
    border: 1px solid #b49a75;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    letter-spacing: 3px;
}

/* 红色通道与舞台、VIP共用中心线 */

.aisle {
    position: absolute;
    left: 47.75%;
    top: 34%;
    width: 4.5%;
    height: 63%;
    background: #c83d35;
}

.table {
    position: absolute;
    width: 6%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%,-50%);
    border: 1px solid #b49a75;
    border-radius: 50%;
    background: #fff;
    color: #806d55;
    font-size: clamp(9px, 2.2vw, 13px);
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    z-index: 2;
}

.table.active {
    background: #b49a75;
    color: white;
    border: 2px solid #806d55;
    transform: translate(-50%,-50%) scale(1.15);
}

.vip {
    width: 15%;
    background: #f4ead9;
    border: 1.5px solid #b49a75;
    font-size: clamp(12px, 3vw, 17px);
    color: #806d55;
}

.vip.active {
    background: #b49a75;
    color: white;
}

.legend {
    font-size: 12px;
    color: #998875;
    margin: 15px;
}

footer {
    padding: 30px 10px;
    background: #eee4d5;
    font-size: 11px;
    letter-spacing: 3px;
    line-height: 2;
}
</style>
</head>

<body>

<header>
    <div class="small-title">THE WEDDING CELEBRATION</div>
    <h1>Benjamin & Demi</h1>
    <div class="date">26 DECEMBER 2026</div>
</header>

<div class="container">

    <h2>Find Your Table</h2>

    <p class="description">
        Welcome to our wedding celebration.<br>
        Enter your name to find your seat.
    </p>

    <input
        id="guestName"
        type="text"
        placeholder="Enter your full name"
        onkeydown="if(event.key==='Enter') searchGuest()"
    >

    <button class="search-button" onclick="searchGuest()">
        SEARCH YOUR TABLE
    </button>

    <div id="result"></div>

    <div class="map-heading">
        <h2>Seating Plan</h2>
        <p class="description">Tap a table to view the guest list.</p>
    </div>

    <div class="map">

        <div class="stage">STAGE</div>

        <div class="aisle"></div>

        <button class="table vip"
            id="table-1"
            style="left:50%;top:27%;"
            onclick="showTable(1)">
            👑 01
        </button>

        <div id="tableContainer"></div>

    </div>

    <div class="legend">
        ● Guest Table　　👑 VIP Table
    </div>

    <div id="mapResult"></div>

</div>

<footer>
    WITH LOVE & GRATITUDE<br>
    BENJAMIN & DEMI<br>
    26.12.2026
</footer>

<script>

// 测试宾客名单
const guests = [
    {name:"Test Guest 1", table:2},
    {name:"Test Guest 2", table:2},
    {name:"Test Guest 3", table:3},
    {name:"Test Guest 4", table:3},
    {name:"VIP Guest 1", table:1},
    {name:"VIP Guest 2", table:1}
];

// 酒店桌位原始坐标

const positions = {
    2:[26.6,27],
    3:[55.6,27],

    7:[20.1,36],
    6:[31.4,36],
    5:[49.3,36],
    4:[61,36],

    8:[19.4,46.6],
    9:[26.3,46.6],
    10:[33.7,46.6],
    11:[47.4,46.6],
    12:[54.6,46.6],
    13:[62.1,46.6],

    19:[12.3,54.9],
    18:[21.4,54.9],
    17:[32.8,54.9],
    16:[48,54.9],
    15:[59.4,54.9],
    14:[70.3,54.9],

    20:[11.7,64.8],
    21:[21.8,64.8],
    22:[32.5,64.8],
    23:[47.7,64.8],
    24:[60,64.8],
    25:[69.2,64.8],

    29:[12.7,75],
    28:[32.5,75],
    27:[48,75],
    26:[69,75],

    30:[33,84],
    31:[47,84]
};

// 建立普通桌

const container = document.getElementById("tableContainer");

for (let i = 2; i <= 31; i++) {

    const button = document.createElement("button");

    button.className = "table";
    button.id = "table-" + i;
    button.textContent = String(i).padStart(2,"0");

    // 整体向右调整9%

    button.style.left = (positions[i][0] + 9) + "%";
    button.style.top = positions[i][1] + "%";

    button.onclick = function() {
        showTable(i);
    };

    container.appendChild(button);
}

// 搜索宾客

function searchGuest() {

    const name = document.getElementById("guestName").value.trim();
    const result = document.getElementById("result");

    if (!name) {
        alert("Please enter your name.");
        return;
    }

    const guest = guests.find(
        g => g.name.toLowerCase() === name.toLowerCase()
    );

    result.style.display = "block";

    if (!guest) {
        result.innerHTML = "Sorry, we couldn't find your name.";
        return;
    }

    const number = String(guest.table).padStart(2,"0");

    result.innerHTML = `
        <p>WELCOME!</p>
        <p>Your table number is</p>
        <div class="table-number">
            ${guest.table === 1 ? "👑 " : ""}${number}
        </div>
        <button class="search-button"
            onclick="showTable(${guest.table})">
            VIEW TABLE GUESTS
        </button>
    `;

    highlightTable(guest.table);
}

// 查看同桌宾客

function showTable(number) {

    const members = guests.filter(g => g.table === number);

    const title = number === 1
        ? "👑 VIP TABLE 01"
        : "TABLE " + String(number).padStart(2,"0");

    document.getElementById("mapResult").innerHTML = `
        <h2>${title}</h2>
        <p class="description">
            ${members.length} registered guests
        </p>
        <ul style="list-style:none;padding:0;line-height:2;">
            ${members.length
                ? members.map(g => `<li>${g.name}</li>`).join("")
                : "<li>Guest list not available yet.</li>"
            }
        </ul>
    `;

    highlightTable(number);
}

// 高亮桌子

function highlightTable(number) {

    document.querySelectorAll(".table").forEach(table => {
        table.classList.remove("active");
    });

    document.getElementById("table-" + number)
        .classList.add("active");
}

</script>

</body>
</html>
