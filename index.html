<h2>Find Your Table</h2>

<p class="description">
    Welcome to our wedding celebration.<br>
    Please enter your name to find your seat.
</p>

<input
    type="text"
    id="guestName"
    placeholder="Enter your full name"
    onkeydown="if(event.key==='Enter') searchGuest()"
>

<button onclick="searchGuest()">
    SEARCH YOUR TABLE
</button>

<div id="result"></div>

<div class="divider">✧ ───── ♡ ───── ✧</div>

<h2>Seating Plan</h2>

<p class="description">
    Tap a table to view the guest list.
</p>

<div class="stage">STAGE</div>

<div class="vip-area">
    <div class="table vip"
         onclick="showTable(31)"
         style="width:90px;margin:auto;padding:18px;">
        👑 31
    </div>
    <p class="description">VIP TABLE</p>
</div>

<div id="seatingMap" class="map"></div>

<div id="mapResult"></div>
